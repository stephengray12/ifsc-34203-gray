<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Homework assignment on native audio and video"
    />
    <meta name="author" content="Stephen Gray" />
    <link rel="stylesheet" href="style.css" />
    <title>Native audio and video</title>
  </head>
  <body>
    <!-- VIDEO PLAYER -->
    <div class="player">
      <video id="video" width="640">
        <source src="video/hudson-shelter-falls.mp4" type="video/mp4" />
        <source src="video/hudson-shelter-falls.webm" type="video/webm" />
      </video>

      <div class="controls">
        <button id="play">Play</button>
        <input
          type="range"
          id="progress"
          min="0"
          max="100"
          value="0"
          title="Video progress"
        />
        <span id="time">0:00</span>

        <span id="videoVolumeIcon">🔊</span>
        <input
          type="range"
          id="volume"
          min="0"
          max="1"
          step="0.1"
          value="1"
          title="Video volume"
        />
      </div>
    </div>

    <!-- AUDIO PLAYER -->
    <div class="player">
      <audio id="audio">
        <source src="audio/thunder.mp3" type="audio/mpeg" />
        <source src="audio/thunder.ogg" type="audio/ogg" />
        <source src="audio/thunder.wav" type="audio/wav" />
      </audio>

      <div class="controls">
        <button id="audioPlay">Play</button>
        <input
          type="range"
          id="audioProgress"
          min="0"
          max="100"
          value="0"
          title="Audio progress"
        />

        <span id="audioVolumeIcon">🔊</span>
        <input
          type="range"
          id="audioVolume"
          min="0"
          max="1"
          step="0.1"
          value="1"
          title="Audio volume"
        />
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
